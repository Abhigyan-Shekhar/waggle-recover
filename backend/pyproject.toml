[project]
name = "waggle-recover-backend"
version = "0.1.0"
description = "Waggle Recover — Persistent temporal revenue recovery agent for Razorpay Buildathon"
requires-python = ">=3.11"
authors = [{ name = "Waggle Recover Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # PyPI currently exposes only an obsolete 0.0.1 build. Pin the tested
    # upstream revision so a standalone checkout resolves deterministically.
    "waggle-mcp @ git+https://github.com/Abhigyan-Shekhar/Waggle-mcp.git@cf2118fc62f4972d2c072e9061c6e01da36ecc13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
llm = [
    "openai>=1.30.0",
    "google-genai>=1.0.0",
]
agent = [
    "langgraph>=1.0,<2",
    "groq>=1.0,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "B904"]
