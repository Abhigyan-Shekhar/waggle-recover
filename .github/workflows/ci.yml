name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m ruff check
          app/api/evaluation.py
          app/evaluation/generator.py
          app/evaluation/runner.py
          app/memory/retrieval.py
          app/memory/supersession.py
          app/memory/waggle_adapter.py
          app/persistence/database.py
          app/recovery/decision_engine.py
          app/recovery/orchestrator.py
          tests/test_evaluation.py
          tests/test_reliability.py
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
