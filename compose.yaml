services:
  backend:
    build:
      context: ./backend
    environment:
      APP_DB_PATH: /data/waggle_recover.db
      WAGGLE_DB_PATH: /data/waggle_memory.db
      WAGGLE_EMBEDDING_MODEL: ${WAGGLE_EMBEDDING_MODEL:-fake}
      WAGGLE_TENANT_ID: waggle-recover
      DECISION_PROVIDER: ${DECISION_PROVIDER:-deterministic}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_TEST_EXECUTION_ENABLED: ${RAZORPAY_TEST_EXECUTION_ENABLED:-false}
      RAZORPAY_MOCK_LAB_ENABLED: ${RAZORPAY_MOCK_LAB_ENABLED:-true}
      N8N_ENABLED: ${N8N_ENABLED:-false}
      N8N_ESCALATION_WEBHOOK_URL: ${N8N_ESCALATION_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - waggle-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  waggle-data:
